# Runs on every pull request and every push to main.
# A pull request can only be trusted once this is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  COVERAGE_MIN: 70   # raise this as the test suite grows

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          pip install ruff pytest pytest-cov pip-audit
      - name: Lint
        run: ruff check .
      - name: Type check
        run: |
          if [ -f mypy.ini ] || grep -q '\[tool.mypy\]' pyproject.toml 2>/dev/null; then pip install mypy && mypy .; else echo "mypy not configured — skipping"; fi
      - name: Tests
        run: pytest --cov --cov-fail-under="$COVERAGE_MIN"
      - name: Dependency vulnerabilities
        run: pip-audit
